<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>powercreep</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<style>
  :root {
    /* Colours from cyanlastride.ca's style.css: black, white, teal #008282, red #e00707, cyan hover.
       --close keeps the orange that marks close calls. */
    --bg: #000; --panel: #000; --panel-2: #0b1d1d; --line: #333;
    --text: #fff; --muted: #a0a0a0; --accent: #008282; --close: #e0a13a; --red: #e00707; --hover: cyan;
    --up: #6fbf8b; --down: #d9796a; --same: #7fa8d9; --side: #b4a6f0; --chip: #2a2f38;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(20,22,26,.94);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex;
         gap: 14px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
  .logo span { color: var(--accent); }
  .search { position: relative; flex: 1 1 260px; }
  .search input { width: 100%; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 8px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel);
             border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
             box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .results a { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; }
  .results a.on, .results a:hover { background: var(--panel-2); }
  .results small { color: var(--muted); white-space: nowrap; }
  .btn { padding: 8px 12px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  /* The card grid uses the whole window. */
  body.wide main, body.wide .bar { max-width: none; padding-left: 32px; padding-right: 32px; }
  h1 { font-size: 26px; margin: 0 0 6px; line-height: 1.2; }
  h2 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .lead { max-width: 68ch; color: var(--muted); margin: 0 0 22px; }

  .options { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 10px 14px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 22px; }
  .options label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
  .options select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .options .spacer { flex: 1; }

  .cardview { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
  .hero { position: sticky; top: 76px; }
  .hero img, .ph { width: 100%; height: auto; aspect-ratio: 488/680; border-radius: 4.75% / 3.5%; display: block;
                   background: var(--panel-2); }
  .ph { display: grid; place-items: center; padding: 12px; text-align: center; color: var(--muted);
        border: 1px solid var(--line); }
  .hero img + img { margin-top: 8px; }
  .hero .meta { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .hero .meta a { color: var(--accent); }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .tally button { min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px; cursor: pointer; }
  .tally button:hover:not(:disabled) { border-color: var(--accent); }
  .tally button:disabled { cursor: default; }
  section { scroll-margin-top: 80px; }
  .tally small { display: block; font-size: 12px; line-height: 1.25; }
  .tally b { display: block; font-size: 20px; line-height: 1.2; }
  .tally small { color: var(--muted); }

  section { margin-bottom: 30px; }
  .sechead { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 12px;
             border-bottom: 1px solid var(--line); }
  .sechead .n { color: var(--muted); }
  .sechead p { margin: 0; color: var(--muted); font-size: 13px; flex-basis: 100%; }
  .sechead { flex-wrap: wrap; }
  .up h2 { color: var(--up); } .down h2 { color: var(--down); } .same h2 { color: var(--same); } .close h2 { color: var(--close); } .side h2 { color: var(--side); }
  .chip.mine { background: transparent; border: 1px solid var(--chip); }
  .chip.give { background: transparent; border: 1px solid var(--close); color: var(--close); }

  .row { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 10px; border-radius: 10px; }
  .row:hover { background: var(--panel); }
  .row > img, .row > .ph { width: 220px; height: auto; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; }
  .row .title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: baseline; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
         border: 1px solid var(--line); color: var(--muted); border-radius: 5px; padding: 0 5px; }
  .ms { height: 1em; width: 1em; vertical-align: -0.14em; margin: 0 .5px; }
  .more { margin-top: 8px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); background: var(--panel);
           border: 1px dashed var(--line); border-radius: 10px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .rank { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; padding: 6px 8px; border-radius: 8px; }
  .rank:hover { background: var(--panel); }
  .rank .i { color: var(--muted); text-align: right; }
  .rank .c { color: var(--muted); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }



  /* Map: a network of close calls and sidegrades around one card. */
  .mapwrap { position: relative; border: 3px solid var(--accent); background: #000; margin: 10px 0 14px; }
  .mapwrap svg { display: block; width: 100%; height: min(72vh, 720px); min-height: 380px; touch-action: none; cursor: grab; user-select: none; }
  .mapwrap svg.panning { cursor: grabbing; }
  .mapzoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .mapzoom button { width: 34px; height: 34px; padding: 0; }
  .mapnode { cursor: pointer; }
  .mapnode circle { fill: #c9c9c9; stroke: #000; stroke-width: 2; }
  .mapnode.centre circle { fill: var(--accent); }
  .mapnode.sel circle { stroke: var(--hover); stroke-width: 3; }
  .mapnode text { fill: var(--text); font-size: 12px; paint-order: stroke; stroke: #000; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .mapedge { stroke-width: 2; fill: none; }
  .mapedge.close { stroke: var(--close); }
  .mapedge.side { stroke: var(--side); stroke-dasharray: 6 4; }
  .mapedge.strict { stroke: var(--up); }
  .mapedge.same { stroke: var(--same); stroke-dasharray: 2 4; stroke-linecap: round; }
  .mapdim .mapedge:not(.hot) { opacity: .12; }
  .mapdim .mapnode:not(.hot) { opacity: .3; }
  .maplegend i.close { background: var(--close); }
  .maplegend i.side { background: repeating-linear-gradient(90deg, var(--side) 0 6px, transparent 6px 10px); }
  .maplegend i.strict { background: var(--up); }
  .maplegend i.same { background: repeating-linear-gradient(90deg, var(--same) 0 3px, transparent 3px 6px); }
  .maplayout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; margin: 10px 0 14px; }
  .maplayout .mapwrap { margin: 0; }
  .maplayout #mapinfo { margin: 0; max-height: min(72vh, 720px); min-height: 380px; overflow-y: auto; }
  .mapinfo > img, .mapinfo > .ph { width: 100%; max-width: 240px; height: auto; border-radius: 10px; display: block; margin-bottom: 10px; }
  .mapinfo ul { margin: 6px 0; padding-left: 18px; font-size: 14px; }
  .mapinfo li { margin: 2px 0; }
  .mappeek { position: fixed; z-index: 30; width: 220px; pointer-events: none; }
  .mappeek img, .mappeek .ph { width: 100%; height: auto; border-radius: 10px; display: block; box-shadow: 0 4px 18px rgba(0,0,0,.8); }
  @media (max-width: 900px) { .maplayout { grid-template-columns: 1fr; } .maplayout #mapinfo { max-height: none; min-height: 0; } }

  /* Charts. Series colours are the dark steps of a validated categorical palette, in fixed order. */
  .viz-root { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s0: #898781;
              --grid: #2c3038; --axis: #3a3f4a; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 18px; min-width: 0; }
  .chart h2 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .chart p { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }
  .chart svg { display: block; outline: none; }
  .chart svg:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 6px; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart text.lab { fill: var(--text); font-size: 12px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 10px; font-size: 13px; }
  .legend span { display: inline-flex; gap: 7px; align-items: center; }
  .legend i { width: 16px; height: 2px; border-radius: 1px; }
  .smalls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .smalls .chart { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 4px 12px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: #0e1013; border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 320px; }
  .tip .hd { color: var(--muted); margin-bottom: 4px; }
  .tiprow { display: flex; gap: 8px; align-items: center; }
  .tiprow .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
  .tiprow b { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .tiprow span:last-child { color: var(--muted); }
  .datatable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .datatable th, .datatable td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .datatable th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  .datatable th:first-child, .datatable td:first-child { text-align: left; }
  .tablewrap { overflow-x: auto; }

  .navlink { color: var(--muted); padding: 8px 4px; }
  .navlink:hover { color: var(--text); }
  .ugroup { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .ugroup h2 { margin: 0; font-size: 17px; }
  .ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .ugrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; } }
  .ugrid a { display: block; border-radius: 4.75% / 3.5%; transition: transform .12s; }
  .ugrid a:hover { transform: translateY(-3px); }
  .ugrid img, .ugrid .ph { width: 100%; height: auto; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; display: block; }
  .ufilters { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 0 0 12px; }
  .ufilters .lbl { color: var(--muted); margin-right: 4px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { min-width: 34px; padding: 4px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
          cursor: pointer; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .chip .ms { width: 18px; height: 18px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip.clear { color: var(--muted); border-style: dashed; }
  .deckform { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .deckform summary { cursor: pointer; font-weight: 600; }
  .deckform textarea { display: block; width: 100%; height: 260px; margin: 10px 0; padding: 10px; resize: vertical;
                       background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                       font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .deckview { display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start; }
  .decklist { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
  .decklist .only { display: flex; gap: 7px; align-items: center; padding: 4px 8px 10px; color: var(--muted); cursor: pointer; }
  .pick { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; padding: 5px 8px;
          background: none; border: 0; border-radius: 7px; cursor: pointer; }
  .pick:hover { background: var(--panel); }
  .pick.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .pick .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .b { font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; border-radius: 5px; padding: 0 4px; background: var(--chip); }
  .b.up { color: var(--up); } .b.close { color: var(--close); } .b.down { color: var(--down); }
  .deckcard { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; margin-bottom: 24px; }
  .deckcard > a > img, .deckcard .ph { width: 200px; height: auto; border-radius: 4.75% / 3.5%; display: block; }
  .deckcard h1 a:hover { color: var(--accent); }
  .stepper { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .btn:disabled { opacity: .4; cursor: default; }

  @media (max-width: 760px) {
    .deckview, .deckcard { grid-template-columns: 1fr; }
    .smalls { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .decklist { position: static; max-height: 240px; }
    .cardview { grid-template-columns: 1fr; }
    .hero { position: static; max-width: 240px; }
    .row { grid-template-columns: 1fr; }
    .cols { grid-template-columns: 1fr; }
  }

  /* ---- cyanlastride.ca look: monospace, square corners, teal edges, red links ---- */
  body { font: 16px/1.45 monospace; }
  .site { max-width: 1180px; margin: 0 auto; padding: 24px 20px 0; }
  body.wide .site { max-width: none; padding-left: 32px; padding-right: 32px; }
  .sitetitle { font-size: 36px; color: #008282; margin: 0 0 8px; }
  .sitetitle a, .sitetitle a:hover { color: #008282; }
  .topTitle { display: flex; height: 54px; align-items: center; }
  header { background: rgba(0,0,0,.94); backdrop-filter: none; border-bottom: 3px solid var(--accent); }
  .logo { font-size: 28px; color: var(--accent); letter-spacing: 0; }
  .navlink { color: var(--red); }
  .navlink:hover, .hero .meta a:hover { color: var(--hover); }
  .hero .meta a { color: var(--red); }
  .deckcard h1 a:hover { color: var(--hover); }
  input, select, textarea, .search input, .options select, .deckform textarea { background: #000; border: 1px solid var(--accent) !important; border-radius: 0 !important; }
  input:focus, select:focus, textarea:focus { border-color: var(--hover) !important; }
  .btn, .chip, .seg, .tally button, .options, .results, .tile, .chart, .deckform, .empty, .tip, .row, .rank, .pick, .pick .b, .tag, .swatch { border-radius: 0 !important; }
  .btn, .chip, .tally button { background: #000; border: 1px solid var(--accent); }
  .btn:hover, .chip:hover, .tally button:hover:not(:disabled) { border-color: var(--hover); color: var(--hover); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); box-shadow: none; color: #fff; }
  .options, .tile, .chart, .deckform { border: 3px solid var(--accent); }
  .chart svg:focus-visible { box-shadow: 0 0 0 2px var(--hover); }
  .pick.on { box-shadow: inset 3px 0 0 var(--accent); }
  .sitefoot { max-width: 1180px; margin: 0 auto; padding: 0 20px 40px; }
  .sitefoot a { color: var(--red); } .sitefoot a:hover { color: var(--hover); }
  @media (max-width: 760px) { .sitetitle { font-size: 28px; } }
</style>
</head>
<body>
<div class="site">
  <h1 class="sitetitle"><a href="../index.html" class="topTitle"><img src="../LaStrideSymbol.png" alt="" style="height:54px;">cyanLaStride</a></h1>
</div>
<header>
  <div class="bar">
    <a class="logo" href="#/">powercreep</a>
    <div class="search">
      <input id="q" type="search" placeholder="Search for a card…" autocomplete="off" spellcheck="false">
      <div id="results" class="results" hidden></div>
    </div>
    <a class="navlink" href="#/deck">deck check</a>
    <a class="navlink" href="#/unbeaten">unbeaten</a>
    <a class="navlink" href="#/charts">charts</a>
    <a class="navlink" href="#/map">map</a>
    <button class="btn" id="random">random card</button>
  </div>
</header>
<main id="app"><p class="muted">Loading card data…</p></main>
<footer class="sitefoot"><a href="../index.html">Back</a></footer>

<script src="data.js"></script>
<script>
"use strict";
// CARDS: [name, cost, type, size, date, set index, scryfall id, colour identity, commander legal, has a back face,
//         Universes Beyond or other non-Magic IP]
// PAIRS: [better, worse, flags (1 = strict, 2 = colour-shifted, 4 = other creature types, 8 = close call),
//         reason ids, and for close calls the ids of what the better card gives up]
const NAME = 0, COST = 1, TYPE = 2, SIZE = 3, DATE = 4, SET = 5, ID = 6;
const app = document.getElementById("app");
const byName = new Map(CARDS.map((c, i) => [c[NAME].toLowerCase(), i]));
// "Fire // Ice" can also be found as "Fire" or "Ice", unless another card has that exact name.
CARDS.forEach((c, i) => {
  if (c[NAME].includes(" // ")) for (const part of c[NAME].toLowerCase().split(" // ")) if (!byName.has(part)) byName.set(part, i);
});
const better = CARDS.map(() => []), worse = CARDS.map(() => []);
const nearlyBetter = CARDS.map(() => []), nearlyWorse = CARDS.map(() => []), sides = CARDS.map(() => []);
for (const p of PAIRS) {
  if (p[2] & 16) { sides[p[0]].push(p); sides[p[1]].push(p); }
  else if (p[2] & 8) { nearlyBetter[p[1]].push(p); nearlyWorse[p[0]].push(p); }
  else { better[p[1]].push(p); worse[p[0]].push(p); }
}
// A sidegrade seen from card i, shaped for the row layout: the other card, its edges, and ours.
const sideRows = i => sides[i].filter(allowed).map(p => p[0] === i
  ? [p[1], p[1], p[2], p[4], null, p[3]] : [p[0], p[0], p[2], p[3], null, p[4]]);
// SAME: groups of card indexes that are functionally identical
const twins = CARDS.map(() => []);
for (const g of SAME) for (const i of g) twins[i] = g.filter(j => j !== i);

const opts = { likely: true, shift: false, sameTypes: false, generous: false, noUB: false, sort: "close",
  ubSort: "mv", ubColours: "", ubColourMode: "exact", ubMV: "" };
try { Object.assign(opts, JSON.parse(localStorage.getItem("powercreep-opts") || "{}")); } catch (e) {}
const saveOpts = () => { try { localStorage.setItem("powercreep-opts", JSON.stringify(opts)); } catch (e) {} };
// Pairs flagged 32 only hold in generous mode, and replace any weaker version of the same pair.
const generousKeys = new Set();
for (const p of PAIRS) if (p[2] & 32) { generousKeys.add(p[0] + "," + p[1]); generousKeys.add(p[1] + "," + p[0]); }
// With "no Universes Beyond" on, those cards drop out of every list and comparison.
const UB = 10;
const gone = i => opts.noUB && CARDS[i][UB] === 1;
const allowed = p => !gone(p[0]) && !gone(p[1]) && (opts.likely || (p[2] & 1)) && (opts.shift || !(p[2] & 2)) && (!opts.sameTypes || !(p[2] & 4))
  && (p[2] & 32 ? opts.generous : !(opts.generous && generousKeys.has(p[0] + "," + p[1])));

const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const symbols = s => esc(s).replace(/\{([^}]+)\}/g, (m, sym) => {
  const file = sym.toUpperCase().replace(/\//g, "");
  return `<img class="ms" alt="{${sym.toUpperCase()}}" src="https://svgs.scryfall.io/card-symbols/${file}.svg">`;
});
const year = c => c[DATE].slice(0, 4);
const link = i => "#/card/" + encodeURIComponent(CARDS[i][NAME]);

function sorted(list, other) {
  const date = p => CARDS[p[other]][DATE];
  const cmp = {
    close: (a, b) => (a[2] & 2) - (b[2] & 2) || a[3].length - b[3].length || (b[2] & 1) - (a[2] & 1) || date(a).localeCompare(date(b)),
    new: (a, b) => date(b).localeCompare(date(a)),
    old: (a, b) => date(a).localeCompare(date(b)),
  }[opts.sort];
  return list.slice().sort(cmp);
}

const PAGE = 40;
function rows(list, other, limit) {
  return list.slice(0, limit).map(p => {

    return `<a class="row" href="${link(i)}">

      </div>

  }).join("");
}

const shown = {};
function section(key, cls, title, blurb, list, other) {

// Deck checker: paste a Commander list, step through it card by card.
const IDENTITY = 7, LEGAL = 8;
const deck = { text: "", list: [], qty: new Map(), unknown: [], sel: 0, only: false, editing: false };
try { deck.text = localStorage.getItem("powercreep-deck") || ""; } catch (e) {}
const HEADERS = /^(commander|companion|deck|main(board)?|sideboard|maybeboard|considering|lands?|creatures?|instants?|sorcer(y|ies)|artifacts?|enchantments?|planeswalkers?|battles?|tokens?|spells?|about|name)\b/i;

function parseDeck(text) {
  // The same card can appear on several lines (basics in different printings); copies add up.
  const list = [], unknown = [], qty = new Map();
  for (const raw of text.split("\n")) {
    let line = raw.trim();
    if (!line || line.startsWith("//") || line.startsWith("#")) continue;
    const count = line.match(/^(\d+)\s*x?\s+/i);
    // "1x Name (SET) 123 *F* [Tag]" -> "Name"
    line = line.replace(/^\d+\s*x?\s+/i, "").replace(/\s+[(<*#^\[].*$/, "").replace(/\s*\/+\s*/g, " // ").trim();
    let i = byName.get(line.toLowerCase());
    // A bare collector number after the name: "Forest 278"
    if (i === undefined) i = byName.get(line.replace(/\s+\d+[a-z]?$/i, "").toLowerCase());
    if (i !== undefined) {
      if (!qty.has(i)) list.push(i);
      qty.set(i, (qty.get(i) || 0) + (count ? +count[1] : 1));
    } else if (count || !HEADERS.test(line)) unknown.push(line);
  }
  return { list, unknown, qty };
}
function loadDeck(text) {
  deck.text = text;
  Object.assign(deck, parseDeck(text), { sel: 0, editing: false });
  try { localStorage.setItem("powercreep-deck", text); } catch (e) {}
}
if (deck.text) loadDeck(deck.text);

function deckForm(open) {

  }

      <b style="color:var(--up)">${info.filter(d => d.ups.length).length}</b> have a strict upgrade,

}
function deckStep(by) {
  const y = window.scrollY;
  deck.sel += by;
  for (const k in shown) delete shown[k];
  deckView();
  window.scrollTo(0, y);
  // Stay put, unless the new card's details would start above the screen: then bring their
  // top back into view, just below the sticky header.
  const top = app.querySelector(".deckview").getBoundingClientRect().top;
  if (top < 76) window.scrollTo(0, y + top - 76);

// ---- Unbeaten: every card with no strictly better card and no functionally identical twin ----
const manaValue = c => {
  let mv = 0;
  for (const [, sym] of c[COST].split(" // ")[0].matchAll(/\{([^}]+)\}/g)) {
    if (/^\d+$/.test(sym)) mv += +sym;
    else if (!/^[XYZ]$/.test(sym)) mv += sym.startsWith("2/") ? 2 : 1;
  }
  return mv;
};
const COLOUR_NAMES = { W: "White", U: "Blue", B: "Black", R: "Red", G: "Green" };
const colourGroup = c => c[IDENTITY].length > 1 ? "Multicolour" : COLOUR_NAMES[c[IDENTITY]] || "Colourless";
const COLOUR_ORDER = ["White", "Blue", "Black", "Red", "Green", "Multicolour", "Colourless"];
// A card goes under its most defining type: an artifact creature is a creature.
const TYPE_ORDER = ["Creature", "Planeswalker", "Battle", "Instant", "Sorcery", "Artifact", "Enchantment", "Land", "Other"];
const typeGroup = c => {
  const front = c[TYPE].split(" // ")[0].split(" — ")[0];
  return TYPE_ORDER.find(t => front.includes(t)) || "Other";
};
const UB_SORTS = {
  mv: { label: "Mana value", group: c => manaValue(c), head: k => `Mana value ${k}`, order: (a, b) => a - b },
  colour: { label: "Colour identity", group: colourGroup, head: k => k, order: (a, b) => COLOUR_ORDER.indexOf(a) - COLOUR_ORDER.indexOf(b) },
  type: { label: "Card type", group: typeGroup, head: k => k, order: (a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b) },
};

const UB_PAGE = 120;
const MV_CHIPS = ["0", "1", "2", "3", "4", "5", "6", "7+"];
// Colour filter, on colour identity. "C" on its own means colourless; alongside colours it's
// ignored, except that "at most" always lets colourless cards through.
const COLOUR_MODES = {
  exact: { label: "Exactly", test: (id, pick) => id === pick },
  include: { label: "Including", test: (id, pick) => [...pick].every(ch => id.includes(ch)) },
  most: { label: "At most", test: (id, pick) => [...id].every(ch => pick.includes(ch)) },
};
function unbeatenFilter(c) {
  const pick = "WUBRGC".split("").filter(ch => opts.ubColours.includes(ch)).join("");
  if (pick) {
    if (pick === "C") { if (c[IDENTITY]) return false; }
    else if (!(COLOUR_MODES[opts.ubColourMode] || COLOUR_MODES.exact).test(c[IDENTITY], pick.replace("C", ""))) return false;
  }
  if (opts.ubMV) {
    const mv = manaValue(c), chip = mv >= 7 ? "7+" : String(mv);
    if (!opts.ubMV.split(",").includes(chip)) return false;
  }
  return true;
}

function unbeatenView() {
  document.title = "unbeaten · powercreep";
  const sort = UB_SORTS[opts.ubSort] || UB_SORTS.mv;
  const all = CARDS.map((c, i) => i).filter(i => !gone(i) && !better[i].some(allowed) && !twins[i].some(j => !gone(j)));
  const list = all.filter(i => unbeatenFilter(CARDS[i]))
    .map(i => ({ i, k: sort.group(CARDS[i]) }))
    .sort((a, b) => sort.order(a.k, b.k) || CARDS[a.i][NAME].localeCompare(CARDS[b.i][NAME]));
  const counts = new Map();
  for (const d of list) counts.set(d.k, (counts.get(d.k) || 0) + 1);
  const limit = shown.unbeaten || UB_PAGE;
  let html = "", last;
  for (const d of list.slice(0, limit)) {
    if (d.k !== last) {
      html += `${last === undefined ? "" : "</div>"}<div class="ugroup"><h2>${esc(String(sort.head(d.k)))}</h2>
        <span class="muted">${counts.get(d.k).toLocaleString()} cards</span></div><div class="ugrid">`;
      last = d.k;
    }
    const c = CARDS[d.i];
    html += `<a href="${link(d.i)}" title="${esc(c[NAME])}">${image(c, "large")}</a>`;
  }
  if (last !== undefined) html += "</div>";
  const rest = list.length - limit;

// ---- Charts: how many cards in each category were first printed each year ----
const chartsState = { mode: "count" };
// Fixed order: a category keeps its colour whatever the filters do.
const SERIES = [
  { key: "creeps", color: "var(--s1)", label: "Powercreeps an older card", note: "Strictly better than at least one card printed before it." },
  { key: "near", color: "var(--s2)", label: "Close call on an older card", note: "Nearly better than an older card, with one concession, and not a strict upgrade on any." },
  { key: "later", color: "var(--s3)", label: "Since powercrept", note: "A strictly better card has been printed after it. Recent years have had less time for that." },
  { key: "arrival", color: "var(--s4)", label: "Outclassed on arrival", note: "A strictly better card already existed, or came out alongside it." },
  { key: "reprint", color: "var(--s5)", label: "Functional reprint", note: "Identical to an older card in everything but name." },
];
function yearStats() {
  const years = {}, sets = { creeps: new Set(), near: new Set(), later: new Set(), arrival: new Set(), reprint: new Set() };
  const row = y => years[y] || (years[y] = { year: +y, total: 0, creeps: 0, near: 0, later: 0, arrival: 0, reprint: 0 });
  for (const p of PAIRS) {
    if (!allowed(p)) continue;
    const newer = CARDS[p[0]][DATE] > CARDS[p[1]][DATE];
    if (p[2] & 16) continue;
    if (p[2] & 8) { if (newer) sets.near.add(p[0]); }
    else if (newer) { sets.creeps.add(p[0]); sets.later.add(p[1]); }
    else sets.arrival.add(p[1]);
  }
  for (const i of sets.creeps) sets.near.delete(i);
  for (const all of SAME) {
    const g = all.filter(i => !gone(i));
    const first = g.reduce((m, i) => CARDS[i][DATE] < m ? CARDS[i][DATE] : m, "9");
    for (const i of g) if (CARDS[i][DATE] > first) sets.reprint.add(i);
  }
  CARDS.forEach((c, i) => { if (!gone(i)) row(year(c)).total++; });
  for (const k in sets) for (const i of sets[k]) row(year(CARDS[i]))[k]++;
  return Object.values(years).sort((a, b) => a.year - b.year);
}

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
const tip = document.createElement("div");
tip.className = "tip"; tip.hidden = true;
document.body.appendChild(tip);
function showTip(x, y, heading, rowsData) {
  tip.textContent = "";
  const hd = document.createElement("div"); hd.className = "hd"; hd.textContent = heading; tip.appendChild(hd);
  for (const [color, value, label] of rowsData) {
    const r = document.createElement("div"); r.className = "tiprow";
    if (color) { const k = document.createElement("span"); k.className = "key"; k.style.background = color; r.appendChild(k); }
    const b = document.createElement("b"); b.textContent = value; r.appendChild(b);
    const s = document.createElement("span"); s.textContent = label; r.appendChild(s);
    tip.appendChild(r);
  }
  tip.hidden = false;
  const box = tip.getBoundingClientRect();
  let left = x + 14, top = y - box.height - 10;
  if (left + box.width > innerWidth - 8) left = x - box.width - 14;
  if (top < 8) top = y + 16;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = top + "px";
}
const hideTip = () => { tip.hidden = true; };
function niceTicks(max) {
  if (max <= 0) return [0, 1];
  // The smallest round step that covers the data in at most five intervals.
  const pow = Math.pow(10, Math.floor(Math.log10(max / 5)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => max / s <= 5);
  const out = [];
  for (let v = 0; v < max + step * 0.999; v += step) out.push(+v.toFixed(6));
  return out;
}
const share = () => chartsState.mode === "share";
const chartVal = (r, k) => share() ? (r.total ? r[k] / r.total * 100 : 0) : r[k];
const fmtVal = v => share() ? v.toFixed(1) + "%" : Math.round(v).toLocaleString();
const fmtTick = v => share() ? v + "%" : v >= 1000 ? v / 1000 + "K" : String(v);
const both = (r, k) => `${r[k].toLocaleString()} (${(r.total ? r[k] / r.total * 100 : 0).toFixed(1)}%)`;

function axes(root, rows, m, W, H, ticks, x, y, every) {
  for (const t of ticks) {
    root.appendChild(svg("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), style: `stroke:var(--${t ? "grid" : "axis"})`, "stroke-width": 1 }));
    root.appendChild(svg("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, fmtTick(t)));
  }
  rows.forEach((r, i) => { if (r.year % every === 0) root.appendChild(svg("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, r.year)); });
}

function drawLines(host, rows) {
  host.textContent = "";
  const W = host.clientWidth, H = 340, wide = W >= 700;
  const m = { l: 46, r: wide ? 200 : 14, t: 14, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b, n = rows.length;
  const ticks = niceTicks(Math.max(...rows.flatMap(r => SERIES.map(s => chartVal(r, s.key)))));
  const top = ticks[ticks.length - 1];
  const x = i => m.l + i * pw / (n - 1), y = v => m.t + ph - v / top * ph;
  const root = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "img",
    "aria-label": "Line chart of cards per year in each category. Use the left and right arrow keys to read values; the same numbers are in the table below." });
  axes(root, rows, m, W, H, ticks, x, y, 5);
  const last = rows[n - 1], ends = [];
  for (const s of SERIES) {
    const d = rows.map((r, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(chartVal(r, s.key)).toFixed(1)).join("");
    root.appendChild(svg("path", { d, fill: "none", style: `stroke:${s.color}`, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    ends.push({ s, y: y(chartVal(last, s.key)) });
  }
  // End markers, and a label where there's room: converging lines are left to the legend.
  let prev = -99;
  for (const e of ends.sort((a, b) => a.y - b.y)) {
    root.appendChild(svg("circle", { cx: x(n - 1), cy: e.y, r: 4, style: `fill:${e.s.color};stroke:var(--panel)`, "stroke-width": 2 }));
    if (wide && e.y - prev >= 16) { root.appendChild(svg("text", { x: x(n - 1) + 10, y: e.y + 4, class: "lab" }, e.s.label)); prev = e.y; }
  }
  const cross = svg("g", { visibility: "hidden" });
  const rule = svg("line", { y1: m.t, y2: m.t + ph, style: "stroke:var(--muted)", "stroke-width": 1 });
  cross.appendChild(rule);
  const dots = SERIES.map(s => cross.appendChild(svg("circle", { r: 4, style: `fill:${s.color};stroke:var(--panel)`, "stroke-width": 2 })));
  root.appendChild(cross);
  let at = n - 1;
  const point = (i, px, py) => {
    at = Math.max(0, Math.min(n - 1, i));
    const r = rows[at];
    rule.setAttribute("x1", x(at)); rule.setAttribute("x2", x(at));
    dots.forEach((d, k) => { d.setAttribute("cx", x(at)); d.setAttribute("cy", y(chartVal(r, SERIES[k].key))); });
    cross.setAttribute("visibility", "visible");
    const box = root.getBoundingClientRect();
    showTip(px ?? box.left + x(at), py ?? box.top + m.t + 40, `${r.year} · ${r.total.toLocaleString()} new cards`,
      SERIES.map(s => [s.color, fmtVal(chartVal(r, s.key)), s.label]));
  };
  const off = () => { cross.setAttribute("visibility", "hidden"); hideTip(); };
  const hit = svg("rect", { x: m.l - 10, y: m.t, width: pw + 20, height: ph, fill: "transparent" });
  hit.addEventListener("pointermove", e => point(Math.round((e.clientX - root.getBoundingClientRect().left - m.l) / pw * (n - 1)), e.clientX, e.clientY));
  hit.addEventListener("pointerleave", off);
  root.appendChild(hit);
  root.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); e.stopPropagation();
    point(at + (e.key === "ArrowRight" ? 1 : -1));
  });
  root.addEventListener("focus", () => point(at));
  root.addEventListener("blur", off);
  host.appendChild(root);
}

function drawBars(host, rows, key, color, label) {
  host.textContent = "";
  const counts = key === "total";
  const val = r => counts ? r.total : chartVal(r, key), fmt = v => counts ? Math.round(v).toLocaleString() : fmtVal(v);
  const W = host.clientWidth, H = 190, m = { l: 40, r: 8, t: 18, b: 26 }, pw = W - m.l - m.r, ph = H - m.t - m.b, n = rows.length;
  const max = Math.max(...rows.map(val));
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1], band = pw / n, bw = Math.max(2, Math.min(24, band - 2));
  const x = i => m.l + band * (i + 0.5), y = v => m.t + ph - v / top * ph;
  const root = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Column chart: ${label}, per year. The same numbers are in the table below.` });
  for (const t of [0, top / 2, top]) {
    root.appendChild(svg("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), style: `stroke:var(--${t ? "grid" : "axis"})`, "stroke-width": 1 }));
    root.appendChild(svg("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end" }, counts ? (t >= 1000 ? t / 1000 + "K" : String(t)) : fmtTick(t)));
  }
  rows.forEach((r, i) => { if (r.year % 10 === 5) root.appendChild(svg("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, r.year)); });
  const peak = rows.reduce((b, r, i) => val(r) > val(rows[b]) ? i : b, 0);
  rows.forEach((r, i) => {
    const v = val(r), h = v / top * ph, x0 = x(i) - bw / 2, y0 = m.t + ph - h, rad = Math.min(4, bw / 2, h);
    const bar = svg("path", { style: `fill:${color}`,

    if (h > 0) root.appendChild(bar);

    const hit = svg("rect", { x: x(i) - band / 2, y: m.t, width: band, height: ph, fill: "transparent" });
    hit.addEventListener("pointermove", e => {
      bar.style.opacity = 0.7;
      showTip(e.clientX, e.clientY, String(r.year), counts ? [[color, r.total.toLocaleString(), "new cards"]]
        : [[color, both(r, key), label], [null, r.total.toLocaleString(), "new cards that year"]]);
    });
    hit.addEventListener("pointerleave", () => { bar.style.opacity = 1; hideTip(); });
    root.appendChild(hit);
  });
  // One direct label, on the tallest column.
  const px = Math.max(m.l + 14, Math.min(W - m.r - 14, x(peak)));
  root.appendChild(svg("text", { x: px, y: y(val(rows[peak])) - 5, "text-anchor": "middle", class: "lab" }, fmt(val(rows[peak]))));
  host.appendChild(root);
}

// The state of the whole game at the end of each year: of every card printed so far, how many
// still have no strictly better card and no functionally identical twin among them.
function poolStats() {
  const beaten = new Map(), twinned = new Map();
  const later = (a, b) => a > b ? a : b;
  for (const p of PAIRS) {
    if ((p[2] & 24) || !allowed(p)) continue;
    // A card counts as beaten from the moment both it and the better card exist.
    const when = later(CARDS[p[0]][DATE], CARDS[p[1]][DATE]);
    if (!beaten.has(p[1]) || when < beaten.get(p[1])) beaten.set(p[1], when);
  }
  for (const g of SAME) for (const i of g) {
    if (gone(i) || g.every(j => j === i || gone(j))) continue;
    const other = g.filter(j => j !== i && !gone(j)).reduce((m, j) => CARDS[j][DATE] < m ? CARDS[j][DATE] : m, "9");
    twinned.set(i, later(CARDS[i][DATE], other));
  }
  const years = [...new Set(CARDS.map(year))].sort();
  return years.map(y => {
    const r = { year: +y, pool: 0, beaten: 0, twinned: 0, clean: 0 };
    CARDS.forEach((c, i) => {
      if (year(c) > y || gone(i)) return;
      r.pool++;
      const b = beaten.has(i) && beaten.get(i).slice(0, 4) <= y, t = twinned.has(i) && twinned.get(i).slice(0, 4) <= y;
      if (b) r.beaten++;
      if (t) r.twinned++;
      if (!b && !t) r.clean++;
    });
    r.pct = r.clean / r.pool * 100;
    return r;
  });
}

function drawPool(host, rows) {
  host.textContent = "";
  const W = host.clientWidth, H = 300, m = { l: 46, r: 64, t: 24, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b, n = rows.length;
  // A share that lives in the 90s would be a flat line on a 0-100 axis, so the axis is cut
  // off below the data. Line only, no fill: a filled area would imply a zero baseline.
  const low = Math.floor((Math.min(...rows.map(r => r.pct)) - 0.5) / 2) * 2, step = (100 - low) / 4;
  const x = i => m.l + i * pw / (n - 1), y = v => m.t + ph - (v - low) / (100 - low) * ph;
  const root = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "img",
    "aria-label": "Line chart: share of all cards printed so far that are unique and not strictly beaten, by year. Use the left and right arrow keys to read values; the same numbers are in the table below." });
  for (let t = low; t <= 100.001; t += step) {
    root.appendChild(svg("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), style: `stroke:var(--${t === low ? "axis" : "grid"})`, "stroke-width": 1 }));
    root.appendChild(svg("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, +t.toFixed(1) + "%"));
  }
  rows.forEach((r, i) => { if (r.year % 5 === 0) root.appendChild(svg("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, r.year)); });
  root.appendChild(svg("path", { fill: "none", style: "stroke:var(--s1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
    d: rows.map((r, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(r.pct).toFixed(1)).join("") }));
  // Label the start, the lowest point and the latest year; the rest is on the axis and in the tooltip.
  const lowest = rows.reduce((b, r, i) => r.pct < rows[b].pct ? i : b, 0);
  for (const i of new Set([0, lowest, n - 1])) {
    root.appendChild(svg("circle", { cx: x(i), cy: y(rows[i].pct), r: 4, style: "fill:var(--s1);stroke:var(--panel)", "stroke-width": 2 }));

  const dot = cross.appendChild(svg("circle", { r: 4, style: "fill:var(--s1);stroke:var(--panel)", "stroke-width": 2 }));
  root.appendChild(cross);
  let at = n - 1;
  const share = (k, r) => (r[k] / r.pool * 100).toFixed(1) + "%";
  const point = (i, px, py) => {
    at = Math.max(0, Math.min(n - 1, i));
    const r = rows[at];
    rule.setAttribute("x1", x(at)); rule.setAttribute("x2", x(at));
    dot.setAttribute("cx", x(at)); dot.setAttribute("cy", y(r.pct));
    cross.setAttribute("visibility", "visible");
    const box = root.getBoundingClientRect();
    showTip(px ?? box.left + x(at), py ?? box.top + m.t + 40, `End of ${r.year} · ${r.pool.toLocaleString()} cards in the game`, [
      ["var(--s1)", share("clean", r), `unique and unbeaten (${r.clean.toLocaleString()})`],
      [null, share("beaten", r), `have a strictly better card (${r.beaten.toLocaleString()})`],
      [null, share("twinned", r), `have an identical twin (${r.twinned.toLocaleString()})`]]);
  };
  const off = () => { cross.setAttribute("visibility", "hidden"); hideTip(); };
  const hit = svg("rect", { x: m.l - 10, y: m.t, width: pw + 20, height: ph, fill: "transparent" });
  hit.addEventListener("pointermove", e => point(Math.round((e.clientX - root.getBoundingClientRect().left - m.l) / pw * (n - 1)), e.clientX, e.clientY));
  hit.addEventListener("pointerleave", off);
  root.appendChild(hit);
  root.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); e.stopPropagation();
    point(at + (e.key === "ArrowRight" ? 1 : -1));
  });
  root.addEventListener("focus", () => point(at));
  root.addEventListener("blur", off);
  host.appendChild(root);

      </table></div></details>
  </div>`;
  drawPool(document.getElementById("pool"), pool);
  drawLines(document.getElementById("lines"), rows);
  for (const host of app.querySelectorAll("[data-bars]")) {
    const s = SERIES.find(q => q.key === host.dataset.bars);
    drawBars(host, rows, host.dataset.bars, s ? s.color : "var(--s0)", s ? s.label : "All new cards");
  }
}

// ---- Map: close calls and sidegrades as a network around one card ----
const mapLink = i => "#/map/" + encodeURIComponent(CARDS[i][NAME]);
const onMap = () => location.hash.startsWith("#/map");
const mapState = { depth: 2, close: true, side: true, strict: true, same: true, raf: 0, sel: null };
try { Object.assign(mapState, JSON.parse(localStorage.getItem("powercreep-map") || "{}"), { raf: 0, sel: null }); } catch (e) {}
const saveMap = () => { try { localStorage.setItem("powercreep-map", JSON.stringify({ depth: mapState.depth, close: mapState.close, side: mapState.side, strict: mapState.strict, same: mapState.same })); } catch (e) {} };
const MAP_MAX = 160;
// What each kind of link says, from the better card and from the worse one, and its colour.
const MAP_WORDS = { strict: ["better than", "worse than", "var(--up)"], close: ["nearly better than", "nearly worse than", "var(--close)"],
  side: ["sidegrade with", "sidegrade with", "var(--side)"], same: ["identical to", "identical to", "var(--same)"] };
// The card under the mouse, shown beside the pointer.
const peek = document.createElement("div");
peek.className = "mappeek"; peek.hidden = true;
document.body.appendChild(peek);
function placePeek(ev) {
  const w = 220, h = peek.offsetHeight || 307;
  let left = ev.clientX + 18, top = ev.clientY - h / 2;
  if (left + w > innerWidth - 8) left = ev.clientX - w - 18;
  peek.style.left = Math.max(8, left) + "px";
  peek.style.top = Math.max(8, Math.min(innerHeight - h - 8, top)) + "px";
}
function showPeek(i, ev) {
  if (peek.dataset.i !== String(i)) { peek.innerHTML = image(CARDS[i], "normal").replace(' loading="lazy"', ""); peek.dataset.i = i; }
  peek.hidden = false; placePeek(ev);
}
const hidePeek = () => { peek.hidden = true; };

// Every link touching card i: [other card, kind, better card or null, pair (or a key for twins)].
function mapLinks(i) {
  const out = [];
  if (mapState.strict) for (const p of better[i].concat(worse[i])) if (allowed(p)) out.push([p[0] === i ? p[1] : p[0], "strict", p[0], p]);
  if (mapState.same) for (const j of twins[i]) if (!gone(j)) out.push([j, "same", null, "same:" + Math.min(i, j) + "," + Math.max(i, j)]);
  if (mapState.close) for (const p of nearlyBetter[i].concat(nearlyWorse[i])) if (allowed(p)) out.push([p[0] === i ? p[1] : p[0], "close", p[0], p]);
  if (mapState.side) for (const p of sides[i]) if (allowed(p)) out.push([p[0] === i ? p[1] : p[0], "side", null, p]);
  return out;
}

function mapView(centre) {
  document.title = (centre === undefined ? "map" : CARDS[centre][NAME] + " · map") + " · powercreep";
  const lead = `<label>Steps out <select data-mapopt="depth">${[1, 2, 3].map(d => `<option ${d === mapState.depth ? "selected" : ""}>${d}</option>`).join("")}</select></label>
    <label><input type="checkbox" data-mapopt="close" ${mapState.close ? "checked" : ""}> Close calls</label>
    <label><input type="checkbox" data-mapopt="side" ${mapState.side ? "checked" : ""}> Sidegrades</label>
    <label><input type="checkbox" data-mapopt="strict" ${mapState.strict ? "checked" : ""}> Strictly better</label>
    <label><input type="checkbox" data-mapopt="same" ${mapState.same ? "checked" : ""}> Identical</label>`;
  const head = `<h1>map</h1>`;
  if (centre === undefined) { app.innerHTML = head + `<p class="muted">Search for a card to put it in the middle of the map.</p>`; return; }

  // Breadth-first out from the centre, nearest cards first, until the map is full.
  const depth = new Map([[centre, 0]]), order = [centre];
  for (let k = 0; k < order.length && order.length < MAP_MAX; k++) {
    const i = order[k];
    if (depth.get(i) >= mapState.depth) continue;
    for (const [j] of mapLinks(i)) {
      if (depth.has(j) || gone(j)) continue;
      depth.set(j, depth.get(i) + 1); order.push(j);
      if (order.length >= MAP_MAX) break;
    }
  }
  if (order.length === 1) {
    app.innerHTML = head + `<p class="muted">${esc(CARDS[centre][NAME])} has no links with these settings.</p>` + optionsBar(lead, false);
    return;
  }
  const full = order.length >= MAP_MAX;
  const edges = [], seen = new Set();
  for (const i of order) for (const [j, kind, best, p] of mapLinks(i)) {
    if (!depth.has(j) || seen.has(p)) continue;
    seen.add(p); edges.push({ a: i, b: j, kind, best, p });
  }
  const nodes = order.map((i, k) => {
    const d = depth.get(i), ang = k * 2.399963, r = d * 110 + (d ? Math.sqrt(k) * 4 : 0);
    return { i, d, x: Math.cos(ang) * r, y: Math.sin(ang) * r, vx: 0, vy: 0, fixed: false, deg: 0 };
  });
  const at = new Map(nodes.map(n => [n.i, n]));
  for (const e of edges) { e.s = at.get(e.a); e.t = at.get(e.b); e.s.deg++; e.t.deg++; }

  app.innerHTML = head + optionsBar(lead, false) + `
    <div class="legend maplegend"><span><i class="strict"></i>strictly better (arrow points at the better card)</span><span><i class="close"></i>close call (arrow points at the nearly better card)</span><span><i class="side"></i>sidegrade</span><span><i class="same"></i>identical</span>
      <span class="muted">${nodes.length} cards, ${edges.length} links${full ? ", trimmed to the nearest " + MAP_MAX : ""}</span></div>
    <div class="maplayout"><div class="mapwrap"><svg id="mapsvg" role="img" aria-label="Network of ${nodes.length} cards linked to ${esc(CARDS[centre][NAME])}. The same links are listed in the table below."></svg>
      <div class="mapzoom"><button class="btn" data-mapzoom="1.25" aria-label="Zoom in">+</button><button class="btn" data-mapzoom="0.8" aria-label="Zoom out">−</button><button class="btn" data-mapzoom="fit" aria-label="Fit to screen">⤢</button></div></div>
    <div id="mapinfo" class="chart"></div></div>
    <details class="deckform"><summary>Show the links as a list</summary><div class="tablewrap"><table class="datatable">
      <thead><tr><th>Card</th><th>Link</th><th>Card</th></tr></thead>
      <tbody>${edges.map(e => {
        const [x, y] = e.best === null ? [e.a, e.b] : [e.p[0], e.p[1]];
        return `<tr><td><a href="${mapLink(x)}">${esc(CARDS[x][NAME])}</a></td><td>${MAP_WORDS[e.kind][0]}</td><td><a href="${mapLink(y)}">${esc(CARDS[y][NAME])}</a></td></tr>`;
      }).join("")}</tbody>
    </table></div></details>`;

  const root = document.getElementById("mapsvg");
  const defs = svg("defs", {});
  for (const [kind, colour] of [["close", "var(--close)"], ["strict", "var(--up)"]]) {
    const marker = svg("marker", { id: "maparrow-" + kind, viewBox: "0 0 10 10", refX: 10, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    marker.appendChild(svg("path", { d: "M0,0 L10,5 L0,10 z", fill: colour }));
    defs.appendChild(marker);
  }
  root.appendChild(defs);
  const view = svg("g", {}), edgeLayer = svg("g", {}), nodeLayer = svg("g", {});
  view.append(edgeLayer, nodeLayer); root.appendChild(view);
  const radius = n => n.i === centre ? 11 : Math.min(9, 5 + Math.sqrt(n.deg));
  for (const e of edges) {
    e.el = svg("line", { class: "mapedge " + e.kind });
    if (e.best !== null) e.el.setAttribute("marker-end", "url(#maparrow-" + e.kind + ")");
    edgeLayer.appendChild(e.el);
  }
  const labelAll = nodes.length <= 12;
  for (const n of nodes) {
    n.el = svg("g", { class: "mapnode" + (n.i === centre ? " centre" : ""), tabindex: 0, role: "button", "aria-label": CARDS[n.i][NAME] });
    n.el.appendChild(svg("circle", { r: radius(n) }));
    n.label = svg("text", { x: radius(n) + 4, y: 4 }, CARDS[n.i][NAME]);
    n.el.appendChild(n.label);
    n.el.addEventListener("pointerenter", ev => { if (!drag) { hot(n); if (ev.pointerType === "mouse") showPeek(n.i, ev); } });
    n.el.addEventListener("pointermove", ev => { if (!drag && ev.pointerType === "mouse") placePeek(ev); });
    n.el.addEventListener("pointerleave", () => { hidePeek(); if (!drag) hot(mapState.sel); });
    n.el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n); } });
    n.el.dataset.k = nodes.indexOf(n);
    nodeLayer.appendChild(n.el);
  }
  const near = nodes.filter(n => n.d === 1).length;
  const showLabel = n => { n.label.style.display = labelAll || n.i === centre || n.hot || n.d === 1 && near <= 12 && innerWidth > 700 ? "" : "none"; };

  function hot(n) {
    const on = new Set(n ? [n] : []);
    for (const e of edges) { const h = n && (e.s === n || e.t === n); e.el.classList.toggle("hot", !!h); if (h) { on.add(e.s); on.add(e.t); } }
    for (const m of nodes) { m.hot = on.has(m); m.el.classList.toggle("hot", m.hot); m.el.classList.toggle("sel", m === mapState.sel); showLabel(m); }
    root.classList.toggle("mapdim", !!n);
  }
  function select(n, quiet) {
    mapState.sel = quiet ? null : n; hot(mapState.sel);
    const info = document.getElementById("mapinfo"), c = CARDS[n.i];
    const mine = edges.filter(e => e.s === n || e.t === n).map(e => {
      const o = e.s === n ? e.t : e.s, name = `<a href="${mapLink(o.i)}">${esc(CARDS[o.i][NAME])}</a>`;
      const w = MAP_WORDS[e.kind];
      return `<li><span style="color:${w[2]}">${e.best === null || e.best === n.i ? w[0] : w[1]}</span> ${name}</li>`;
    });
    info.innerHTML = `<div class="mapinfo">${image(c, "normal")}<div>
      <h2 style="margin:0">${esc(c[NAME])} <span style="font-size:.8em">${symbols(c[COST])}</span></h2>
      <p class="muted" style="margin:2px 0 8px">${esc(c[TYPE])}${c[SIZE] ? " · " + esc(c[SIZE]) : ""}</p>
      <div class="examples" style="margin:0 0 6px">${n.i === centre ? "" : `<a class="btn" href="${mapLink(n.i)}">Centre the map here</a>`}<a class="btn" href="${link(n.i)}">Card page</a></div>
      <ul>${mine.join("")}</ul></div></div>`;
  }

  // A small force layout: cards push each other apart, links pull together, everything drifts to the middle.
  let alpha = 1;
  function tick() {
    for (let a = 0; a < nodes.length; a++) for (let b = a + 1; b < nodes.length; b++) {
      const p = nodes[a], q = nodes[b];
      let dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 640000) continue;
      const f = 2600 / d2 * alpha, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      p.vx -= dx * f; p.vy -= dy * f; q.vx += dx * f; q.vy += dy * f;
    }
    for (const e of edges) {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 110) * 0.04 * alpha / d;
      e.s.vx += dx * f; e.s.vy += dy * f; e.t.vx -= dx * f; e.t.vy -= dy * f;
    }
    for (const n of nodes) {
      n.vx -= n.x * 0.004 * alpha; n.vy -= n.y * 0.004 * alpha;
      if (n.fixed || n.i === centre && !n.moved) { n.vx = n.vy = 0; if (!n.fixed) n.x = n.y = 0; continue; }
      n.vx *= 0.6; n.vy *= 0.6;
      n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy));
    }
    alpha = Math.max(0, alpha * 0.985);
  }
  function draw() {
    // Zoom spreads the cards out without making the dots or names any bigger.
    const box = root.getBoundingClientRect(), ox = box.width / 2 + cam.x, oy = box.height / 2 + cam.y;
    for (const n of nodes) { n.sx = ox + n.x * cam.k; n.sy = oy + n.y * cam.k; }
    for (const e of edges) {
      const dx = e.t.sx - e.s.sx, dy = e.t.sy - e.s.sy, d = Math.sqrt(dx * dx + dy * dy) || 1;
      // Lines stop at the edge of each circle so the arrowhead stays visible.
      const from = e.best !== null && e.best !== e.t.i ? e.t : e.s, to = from === e.s ? e.t : e.s;
      const ux = (to.sx - from.sx) / d, uy = (to.sy - from.sy) / d;
      e.el.setAttribute("x1", from.sx + ux * radius(from)); e.el.setAttribute("y1", from.sy + uy * radius(from));
      e.el.setAttribute("x2", to.sx - ux * (radius(to) + 2)); e.el.setAttribute("y2", to.sy - uy * (radius(to) + 2));
    }
    for (const n of nodes) n.el.setAttribute("transform", `translate(${n.sx.toFixed(1)},${n.sy.toFixed(1)})`);
  }
  const cam = { x: 0, y: 0, k: 1 };
  let dirty = true;
  function fit() {
    const box = root.getBoundingClientRect();
    let wx = 1, wy = 1;
    for (const n of nodes) { wx = Math.max(wx, Math.abs(n.x)); wy = Math.max(wy, Math.abs(n.y)); }
    cam.k = Math.min(1.8, (box.width / 2 - 100) / wx, (box.height / 2 - 24) / wy); cam.x = cam.y = 0; dirty = true;
  }
  for (let k = 0; k < 220; k++) tick();
  alpha = 0.15; fit();
  // Only redraw while something is moving, so an idle map costs nothing.
  const loop = () => { if (alpha > 0.002) { tick(); dirty = true; } if (dirty) { draw(); dirty = false; } mapState.raf = requestAnimationFrame(loop); };
  mapState.raf = requestAnimationFrame(loop);
  select(nodes[0], true);

  // Dragging a card moves it; dragging the background pans; a click without moving selects.
  let drag = null;
  const world = ev => { const box = root.getBoundingClientRect(); return [(ev.clientX - box.left - box.width / 2 - cam.x) / cam.k, (ev.clientY - box.top - box.height / 2 - cam.y) / cam.k]; };
  root.addEventListener("pointerdown", ev => {
    const g = ev.target.closest(".mapnode");
    drag = { node: g ? nodes[+g.dataset.k] : null, x: ev.clientX, y: ev.clientY, moved: false };
    root.setPointerCapture(ev.pointerId);
    hidePeek();
    if (!drag.node) root.classList.add("panning");
    hideTip();
  });
  root.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && dx * dx + dy * dy < 16) return;
    drag.moved = true; dirty = true;
    if (drag.node) { const [x, y] = world(ev); Object.assign(drag.node, { x, y, fixed: true, moved: true }); alpha = Math.max(alpha, 0.3); }
    else { cam.x += dx; cam.y += dy; drag.x = ev.clientX; drag.y = ev.clientY; }
  });
  const end = () => {
    if (!drag) return;
    if (drag.node && !drag.moved) select(drag.node);
    if (drag.node) drag.node.fixed = false;
    drag = null; root.classList.remove("panning");
  };
  root.addEventListener("pointerup", end); root.addEventListener("pointercancel", end);
  const zoom = (f, cx = 0, cy = 0) => {
    const k = Math.max(0.05, Math.min(8, cam.k * f)); f = k / cam.k;
    cam.x = cx - (cx - cam.x) * f; cam.y = cy - (cy - cam.y) * f; cam.k = k; dirty = true;
  };
  root.addEventListener("wheel", ev => {
    ev.preventDefault();
    const box = root.getBoundingClientRect();
    zoom(Math.exp(-ev.deltaY * 0.0015), ev.clientX - box.left - box.width / 2, ev.clientY - box.top - box.height / 2);
  }, { passive: false });
  app.querySelector(".mapzoom").addEventListener("click", ev => {
    const b = ev.target.closest("[data-mapzoom]");
    if (!b) return;
    if (b.dataset.mapzoom === "fit") fit(); else zoom(+b.dataset.mapzoom);
  });
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (location.hash.startsWith("#/charts")) rerender(); }, 150);
});

const onDeck = () => location.hash.startsWith("#/deck");
function render() {
  const m = location.hash.match(/^#\/card\/(.+)$/);
  const i = m ? byName.get(decodeURIComponent(m[1]).toLowerCase()) : undefined;
  hideTip();
  if (mapState.raf) { cancelAnimationFrame(mapState.raf); mapState.raf = 0; }
  hidePeek();
  document.body.classList.toggle("wide", location.hash.startsWith("#/unbeaten") || onMap());
  const mm = location.hash.match(/^#\/map(?:\/(.+))?$/);
  if (mm) { const ci = mm[1] ? byName.get(decodeURIComponent(mm[1]).toLowerCase()) : undefined; mapView(ci === undefined || gone(ci) ? undefined : ci); return; }
  if (onDeck()) deckView(); else if (location.hash.startsWith("#/charts")) chartsView();
  else if (location.hash.startsWith("#/unbeaten")) unbeatenView();
  else if (i === undefined) homeView(); else cardView(i);
}
function route() {
  for (const k in shown) delete shown[k];
  render();
  window.scrollTo(0, 0);
}
function rerender() {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}
window.addEventListener("hashchange", route);

app.addEventListener("change", e => {
  if (e.target.dataset.deckopt) { deck.only = e.target.checked; deck.sel = 0; rerender(); return; }
  const mk = e.target.dataset.mapopt;
  if (mk) { mapState[mk] = e.target.type === "checkbox" ? e.target.checked : +e.target.value; saveMap(); rerender(); return; }
  const key = e.target.dataset.opt;
  if (!key) return;
  opts[key] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  saveOpts(); rerender();
});
app.addEventListener("click", e => {
  const ub = e.target.closest("[data-ubcolour], [data-ubmv], [data-ubclear]");
  if (ub) {
    if (ub.dataset.ubcolour) {
      const ch = ub.dataset.ubcolour;
      opts.ubColours = opts.ubColours.includes(ch) ? opts.ubColours.replace(ch, "") : opts.ubColours + ch;
    } else if (ub.dataset.ubmv) {
      const set = new Set(opts.ubMV ? opts.ubMV.split(",") : []);
      set.has(ub.dataset.ubmv) ? set.delete(ub.dataset.ubmv) : set.add(ub.dataset.ubmv);
      opts.ubMV = MV_CHIPS.filter(v => set.has(v)).join(",");
    } else if (ub.dataset.ubclear === "colour") opts.ubColours = "";
    else opts.ubMV = "";
    delete shown.unbeaten;
    saveOpts(); rerender();
    return;
  }
  const pick = e.target.closest("[data-pick]"), step = e.target.closest("[data-step]"), jump = e.target.closest("[data-jump]");
  if (jump) {
    // The first of these sections that's on the page (later cards may all be in the second).
    const target = jump.dataset.jump.split(" ").map(k => document.getElementById("sec-" + k)).find(Boolean);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      // If anything above it changed size on the way down, finish the job.
      addEventListener("scrollend", () => {
        if (Math.abs(target.getBoundingClientRect().top - 80) > 4) target.scrollIntoView({ block: "start" });
      }, { once: true });
    }
    return;
  }
  if (pick) { deckStep(+pick.dataset.pick - deck.sel); return; }
  if (step) { deckStep(+step.dataset.step); return; }
  if (e.target.dataset.mode) { chartsState.mode = e.target.dataset.mode; rerender(); return; }
  if (e.target.dataset.act === "analyse") { loadDeck(document.getElementById("decktext").value); route(); return; }
  const key = e.target.dataset.more;
  if (!key) return;
  shown[key] = (shown[key] || (key === "unbeaten" ? UB_PAGE : PAGE)) + PAGE * 3;
  rerender();
});

// Search
const q = document.getElementById("q"), box = document.getElementById("results");
let hits = [], active = 0;
function search() {
  const term = q.value.trim().toLowerCase();
  hits = [];
  if (term.length >= 2) {
    const starts = [], contains = [];
    for (let i = 0; i < CARDS.length && starts.length < 10; i++) {
      const n = CARDS[i][NAME].toLowerCase(), at = n.indexOf(term);
      if (gone(i)) continue;
      if (at === 0) starts.push(i); else if (at > 0 && contains.length < 10) contains.push(i);
    }
    hits = starts.concat(contains).slice(0, 10);
  }
  active = 0;
  box.hidden = !hits.length;
  box.innerHTML = hits.map((i, k) => `<a href="${onMap() ? mapLink(i) : link(i)}" class="${k === active ? "on" : ""}">
    <span>${esc(CARDS[i][NAME])}</span><small>${better[i].filter(allowed).length} better · ${worse[i].filter(allowed).length} worse</small></a>`).join("");
}
function go(i) { location.hash = onMap() ? mapLink(i) : link(i); q.value = ""; box.hidden = true; q.blur(); }
q.addEventListener("input", search);
q.addEventListener("focus", search);
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && hits.length) { go(hits[active]); return; }
  if (e.key === "Escape") { box.hidden = true; return; }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  if (!hits.length) return;
  active = (active + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
  [...box.children].forEach((el, k) => el.classList.toggle("on", k === active));
});
box.addEventListener("click", () => { q.value = ""; box.hidden = true; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) box.hidden = true; });
document.addEventListener("keydown", e => {
  // Arrow keys step through the deck, unless you're typing somewhere.
  if (onDeck() && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const by = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    const n = app.querySelectorAll(".pick").length;
    if (by && deck.sel + by >= 0 && deck.sel + by < n) { e.preventDefault(); deckStep(by); return; }
  }
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
document.getElementById("random").addEventListener("click", () => {
  const pool = CARDS.map((c, i) => i).filter(i => !gone(i) && (better[i].some(allowed) || worse[i].some(allowed)
    || nearlyBetter[i].some(allowed) || nearlyWorse[i].some(allowed)));
  go(pool[Math.floor(Math.random() * pool.length)]);
});

route();
</script>
</body>
</html>
